# packages.yml — CI packaging pipeline for Arktos.
#
# One job per distributable artifact. All jobs build from the same commit
# and upload their result as a workflow artifact. No release is created —
# artifacts are downloaded from the Actions run page.
#
# Qt comes from jurplel/install-qt-action on linux/macos (Qt 6.12 +
# qtwebengine qt5compat qtwebchannel qtpositioning — webchannel and
# positioning are transitive deps of webenginewidgets that aqt does not
# auto-install). Windows installs Qt via aqt directly with a patch for
# the 6.11+ per-arch repo layout (upstream aqtinstall issue #1022).
# The package drivers (.devin/pkg-*.sh) locate qmake via $QTDIR, which
# each job derives from qmake on PATH.
#
# Coverage:
#   deb      — .devin/pkg-deb.sh (dpkg-buildpackage path) → dist/*.deb
#   rpm      — .devin/pkg-rpm.sh (rpmbuild, spec at rpm/arktos.spec)
#   flatpak  — flatpak-builder action → com.arktos_browser.Arktos.flatpak
#   windows  — qmake + nmake + windeployqt → zipped portable package
#   macos    — qmake + make + macdeployqt → Arktos.dmg

name: packages

on:
  workflow_dispatch:
  push:
    # rust-core is the live integration lane for the facade the packages
    # ship — its pushes get the same green-gate coverage as master.
    # The concurrency group is per-ref, so the lanes never preempt each
    # other's runs.
    branches: [master, rust-core]
    tags: ['v*']
    # lane bookkeeping (task tables, worklog, loop logs) must not
    # trigger — or cancel — packaging runs.  .devin/pkg-*.sh stays a
    # real trigger since it IS the packaging logic.
    paths-ignore:
      - '.devin/WORKLOG.md'
      - '.devin/Arora-Task*.md'
      - '.devin/*.log'

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    # dpkg-shlibdeps bakes the BUILD host's library versions into
    # Depends: floors — a 26.04 build demands libc6>=2.43 that no
    # stable distro can install, a 24.04 build installs on noble,
    # Zorin 18 (noble-based) and every newer Ubuntu.  Build both so
    # each distro generation gets exact-fit floors.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, tag: ubuntu24.04 }
          - { os: ubuntu-26.04, tag: ubuntu26.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtwebengine qt5compat qtwebchannel qtpositioning qtserialport'
          aqtversion: '>=3.3.0'
          cache: true

      - name: Derive QTDIR
        run: |
          QMAKE="$(command -v qmake || true)"
          [ -n "$QMAKE" ] || { echo "no qmake on PATH — install-qt did not expose bin" >&2; exit 1; }
          QTDIR="$(dirname "$(dirname "$(readlink -f "$QMAKE")")")"
          echo "QTDIR=$QTDIR" >> "$GITHUB_ENV"

      - name: Install tor runtime deps + verify tools
        # libevent-2.1-7: bundled tor's ldd target.  bubblewrap: the
        # pack verify leg's bwrap launcher — present on the 26.04
        # image, absent on 24.04 (exit 127 right after dpkg install).
        run: sudo apt-get update -qq && sudo apt-get install -y libevent-2.1-7 bubblewrap

      - name: Allow unprivileged userns for bwrap verify (24.04 apparmor)
        # noble defaults kernel.apparmor_restrict_unprivileged_userns=1,
        # which makes bwrap fail with "Creating new namespace failed" —
        # silently, since the capture dies under set -e.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        if: matrix.os == 'ubuntu-24.04'

      - name: Cache servo-embed cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/servo/servo-embed
          key: servo-${{ matrix.tag }}

      - name: Build servo-embed cdylib
        # Building it BEFORE qmake matters: .qmake.conf auto-enables
        # CONFIG+=servo only while the artifact exists on disk — the
        # backend must be compiled in for the package to carry Servo.
        # clang+libclang feed mozjs-sys's bindgen; fontconfig/freetype/
        # expat are yeslogic-*-sys pkg-config lookups.
        run: |
          sudo apt-get install -y clang libclang-dev \
              libfontconfig-dev libfreetype6-dev libexpat1-dev \
              libglib2.0-dev libunwind-dev
          # The crate's .cargo/config.toml pins a machine-local lld
          # wrapper — override it for the runner's real path (the
          # debug link still wants a memory-lean linker).
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER="$PWD/spikes/servo/servo-embed/cc-lld.sh"
          cargo build --release --manifest-path spikes/servo/servo-embed/Cargo.toml
          test -f spikes/servo/servo-embed/target/release/libservo_embed.so

      - name: Build .deb
        run: ./.devin/pkg-deb.sh

      - name: Tag artifact name with build base
        run: |
          set -e
          for f in dist/*.deb; do
            mv "$f" "${f%.deb}-${{ matrix.tag }}.deb"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: arktos-deb-${{ matrix.tag }}
          path: dist/*.deb

  rpm:
    # Same oldest-base rule as the deb: the spec's SONAME Requires
    # carry no floors, but ELF symbol versions from a 2.43 build still
    # hard-require new glibc at runtime on any older target.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtwebengine qt5compat qtwebchannel qtpositioning qtserialport'
          aqtversion: '>=3.3.0'
          cache: true

      - name: Derive QTDIR
        run: |
          QMAKE="$(command -v qmake || true)"
          [ -n "$QMAKE" ] || { echo "no qmake on PATH — install-qt did not expose bin" >&2; exit 1; }
          QTDIR="$(dirname "$(dirname "$(readlink -f "$QMAKE")")")"
          echo "QTDIR=$QTDIR" >> "$GITHUB_ENV"

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Cache servo-embed cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/servo/servo-embed
          key: servo-rpm

      - name: Build servo-embed cdylib
        run: |
          sudo apt-get install -y clang libclang-dev \
              libfontconfig-dev libfreetype6-dev libexpat1-dev \
              libglib2.0-dev libunwind-dev
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER="$PWD/spikes/servo/servo-embed/cc-lld.sh"
          cargo build --release --manifest-path spikes/servo/servo-embed/Cargo.toml
          test -f spikes/servo/servo-embed/target/release/libservo_embed.so

      - name: Build .rpm
        run: ./.devin/pkg-rpm.sh

      - uses: actions/upload-artifact@v7
        with:
          name: arktos-rpm
          path: dist/*.rpm

  # The generated NoServo manifest + metainfo must track the canonical
  # servo manifest — verified on the host runner because the flatpak
  # container image ships python3 but neither pip nor PyYAML.
  manifest-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Check generated NoServo manifest is in sync
        run: |
          python3 -c 'import yaml' 2>/dev/null \
              || python3 -m pip install --quiet pyyaml \
              || pip3 install --quiet pyyaml
          python3 flatpak/gen-flavor-manifest.py --check

  flatpak:
    runs-on: ubuntu-26.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        # Two flavors, distinct app-ids (side-by-side installs):
        #   servo   — canonical manifest, builds the servo-embed module
        #   noservo — generated QtWebEngine-only sibling
        #             (flatpak/gen-flavor-manifest.py, committed)
        include:
          - flavor: servo
            manifest: com.arktos_browser.Arktos.yaml
            bundle: com.arktos_browser.Arktos.flatpak
          - flavor: noservo
            manifest: com.arktos_browser.ArktosNoServo.yaml
            bundle: com.arktos_browser.ArktosNoServo.flatpak
    steps:
      - uses: actions/checkout@v7

      - name: Build flatpak bundle
        # flatpak-builder handles the KDE 6.11 runtime + qtwebengine
        # baseapp + rust SDK extension declared in the manifest; the
        # vendored cargo-sources.json keeps the build offline-exact.
        # SRV01: the servo manifest's servo-embed module compiles
        # libservo_embed.so inside the SDK (mirroring the deb leg's
        # pre-package cargo build — the in-sandbox build is also what
        # makes the artifact link against the runtime's glibc, not the
        # runner's).  The rust-cache analog is flatpak-builder's own
        # state dir: the action restores any cache matching the
        # flatpak-builder-${arch}-${flavor} prefix, so flavor+arch-
        # prefixing the key lets an unchanged servo-embed module skip
        # its ~700-crate rebuild on the next commit.
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: ${{ matrix.manifest }}
          bundle: ${{ matrix.bundle }}
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo
          cache-key: flatpak-builder-x86_64-${{ matrix.flavor }}-${{ github.sha }}
          verbose: true

      - uses: actions/upload-artifact@v7
        with:
          name: arktos-flatpak-${{ matrix.flavor }}
          path: ${{ matrix.bundle }}

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Two flavors, like flatpak: servo builds servo_embed.dll (the
        # .qmake.conf probe auto-enables CONFIG+=servo), noservo skips
        # it and ships QtWebEngine-only.  Distinct PRODUCT_NAME keeps
        # installer filename/install dir/uninstall key side-by-side.
        include:
          - { flavor: servo,   product_name: 'Arktos',         zip: arktos-windows-servo.zip }
          - { flavor: noservo, product_name: 'Arktos NoServo', zip: arktos-windows-noservo.zip }
    env:
      # rustdl's reqwest -> rustls -> aws-lc-sys chain compiles C+asm
      # via the cc crate; NASM is not on windows-latest by default and
      # aws-lc's Windows x64 path requires it.  Install it below — this
      # env stays as the C-fallback escape hatch (constant-time, just
      # no asm speedups) if the install ever regresses.
      AWS_LC_SYS_NO_ASM: '0'
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v7

      - name: Install NASM (aws-lc-sys asm)
        shell: pwsh
        run: choco install nasm -y --no-progress

      - name: Cache servo-embed cargo target
        if: matrix.flavor == 'servo'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/servo/servo-embed
          key: servo-windows

      - name: Build servo-embed cdylib
        if: matrix.flavor == 'servo'
        # servo-embed's .cargo/config.toml only pins a linker for the
        # linux triple — windows-msvc links plain.  Built BEFORE qmake
        # so .qmake.conf auto-enables CONFIG+=servo off servo_embed.dll.
        # longpaths + CLI fetch: the servo checkout contains WPT test
        # paths that blow past MAX_PATH=260 under libgit2.
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $env:CARGO_NET_GIT_FETCH_WITH_CLI = 'true'
          cargo build --release --manifest-path spikes/servo/servo-embed/Cargo.toml
          if (-not (Test-Path spikes\servo\servo-embed\target\release\servo_embed.dll)) { throw "servo_embed.dll missing" }

      # install-qt-action is bypassed here: Qt 6.11+ ships Windows metadata as
      # per-arch repos (qt6_6120/qt6_6120_msvc2022_64/) with no shared catalog,
      # which aqt (even latest 3.3.0) cannot parse — aqtinstall issue #1022.
      # We patch aqt's extension_for_arch to map win64_* -> the arch suffix,
      # making it resolve the per-arch Updates.xml directly.
      - name: Install Qt 6.12.0 (aqt + repo-layout patch)
        shell: pwsh
        run: |
          python -m pip install --quiet "aqtinstall==3.3.0"
          $patch = @'
          import pathlib
          import aqt.metadata
          p = pathlib.Path(aqt.metadata.__file__)
          s = p.read_text()
          anchor = "        return \"\"\n\n    @staticmethod\n    def possible_extensions_for_arch"
          assert anchor in s, "aqt layout changed; patch anchor not found"
          insert = "        elif is_version_ge_6 and architecture.startswith(\"win64_\"):\n            return architecture[len(\"win64_\"):]\n"
          s = s.replace(anchor, insert + "        return \"\"\n\n    @staticmethod\n    def possible_extensions_for_arch")
          p.write_text(s)
          print("patched aqt extension_for_arch for win64_* per-arch repos")
          '@
          Set-Content -Path patch_aqt.py -Value $patch
          python patch_aqt.py
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir "$env:RUNNER_WORKSPACE\Qt" --modules qtwebengine qt5compat qtwebchannel qtpositioning
          $qt = "$env:RUNNER_WORKSPACE\Qt\6.12.0\msvc2022_64"
          if (-not (Test-Path "$qt\bin\qmake.exe")) { Write-Error "qmake not found at $qt"; exit 1 }
          "QTDIR=$qt" >> $env:GITHUB_ENV
          "$qt\bin" >> $env:GITHUB_PATH

      - name: Build
        shell: cmd
        run: |
          rem MSVC env without ilammy/msvc-dev-cmd (it still targets
          rem Node 20): glob for vcvars64.bat under the VS install root.
          rem (vswhere lives under "Program Files (x86)" — a literal ')'
          rem inside a for-in () clause breaks cmd parsing, so glob the
          rem paren-free path instead of invoking it.)
          set "VCVARS="
          for /d %%v in ("C:\Program Files\Microsoft Visual Studio\*") do (
            for /d %%e in ("%%v\*") do (
              if not defined VCVARS if exist "%%e\VC\Auxiliary\Build\vcvars64.bat" set "VCVARS=%%e\VC\Auxiliary\Build\vcvars64.bat"
            )
          )
          if not defined VCVARS (echo vcvars64.bat not found & exit /b 1)
          call "%VCVARS%"
          rem vcvars env dies with this step — re-export the piece the
          rem NSIS step needs (CRT redist dir for the installer payload).
          echo VCToolsRedistDir=%VCToolsRedistDir%>> %GITHUB_ENV%
          "%QTDIR%\bin\qmake.exe" -o Makefile arktos.pro
          rem Packaging only needs the app — autotests/tools aren't
          rem deployed, and serial nmake over ~65 test binaries stalls
          rem the job for hours. Build just the src subdir target.
          nmake sub-src

      - name: Deploy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path deploy | Out-Null
          Copy-Item arktos.exe deploy\
          & "$env:QTDIR\bin\windeployqt.exe" --release --no-translations deploy\arktos.exe
          # servo-embed DLL beside the exe — ServoBackend::artifactPath()
          # resolves <bindir>/servo_embed.dll.
          if (Test-Path spikes\servo\servo-embed\target\release\servo_embed.dll) {
            Copy-Item spikes\servo\servo-embed\target\release\servo_embed.dll deploy\
          }
          # RC10 link-proof: cargo is guaranteed on this leg (the
          # servo-embed build above hard-fails without it), so the
          # rustcore staticlib MUST be inside the exe — a qmake that
          # silently dropped CONFIG+=rustcore ships the no-rust fallback
          # and every smoke still passes.  PE images carry no symtab, so
          # the probe is a rust-side rodata string only linked crate
          # objects can provide ("panic inside rustcore" is the
          # catch_unwind error string baked into every rc_*/ac_* entry).
          if (-not (Test-Path src\rustcore\target\release\arktos_rustcore.lib)) {
            throw "arktos_rustcore.lib missing — rustcore was not built"
          }
          findstr /m /c:"panic inside rustcore" deploy\arktos.exe | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "rustcore marker absent from arktos.exe — staticlib not linked" }
          # servo_embed.dll is the one rust artifact shipped as a file —
          # the servo leg's build step guarantees it, so it must be
          # staged there; the noservo leg must NOT carry it.
          if ($env:FLAVOR -eq 'servo' -and -not (Test-Path deploy\servo_embed.dll)) { throw "servo_embed.dll missing from deploy payload" }
          if ($env:FLAVOR -eq 'noservo' -and (Test-Path deploy\servo_embed.dll)) { throw "noservo payload carries servo_embed.dll" }
          # Arktos data payload — installedDataDirectory() resolves to
          # the exe dir on Windows, so stage beside it.
          Copy-Item -Recurse src\.qm\locale deploy\locale
          Copy-Item src\useragent\useragents.xml deploy\
          if (Test-Path src\data\extensions) { Copy-Item -Recurse src\data\extensions deploy\extensions }
          # Tor expert bundle (windows-x86_64) — same artifact+pin as
          # BuildProcess/fetch-tor.sh, which is sh-only.
          $tv = "15.0.25"
          $tb = "tor-expert-bundle-windows-x86_64-$tv.tar.gz"
          $base = "https://dist.torproject.org/torbrowser/$tv"
          Invoke-WebRequest "$base/$tb" -OutFile $tb
          Invoke-WebRequest "$base/sha256sums-unsigned-build.txt" -OutFile tor-sums.txt
          $expected = (Select-String -Path tor-sums.txt -Pattern " $([regex]::Escape($tb))$").Line.Split(' ')[0]
          $actual = (Get-FileHash $tb -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "tor bundle sha256 mismatch: $actual != $expected" }
          tar -xzf $tb
          Copy-Item -Recurse tor deploy\tor
          Copy-Item -Recurse data deploy\data
          Compress-Archive -Path deploy\* -DestinationPath "${{ matrix.zip }}"

      - name: Installer (NSIS)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # choco's PATH refresh does not propagate between steps —
          # resolve makensis from its install dir explicitly (a plain
          # path string — $cmd.Source only exists on CommandInfo).
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { $makensis = 'C:\Program Files\NSIS\makensis.exe' }
          if (-not (Test-Path $makensis)) { $makensis = (Get-Command makensis -ErrorAction Stop).Source }
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue | Select-Object -Last 1
          # makensis cd's into the script's dir, so every path it sees
          # must be absolute — relative ones silently resolve under
          # BuildProcess\ (that's what broke the icon load).
          $nsisArgs = @(
            "/DDEPLOYDIR=$PWD\deploy",
            "/DICONFILE=$PWD\BuildProcess\browser.ico",
            "/DOUTDIR=$PWD",
            "/DSRCDIR=$PWD\src",
            "/DPRODUCT_NAME=${{ matrix.product_name }}"
          )
          if ($crt) { $nsisArgs += "/DVCREDIST=$($crt.FullName)" }
          & $makensis @nsisArgs BuildProcess\windowsinstaller.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v7
        with:
          name: arktos-windows-${{ matrix.flavor }}
          path: |
            ${{ matrix.zip }}
            *Installer*.exe

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Same flavor split as flatpak/windows: the noservo leg skips
        # the servo-embed build so .qmake.conf's artifact probe leaves
        # CONFIG+=servo off; the bundle is renamed ArktosNoServo.app +
        # dmg gets a -NoServo suffix for side-by-side installs.
        include:
          - { flavor: servo,   app: 'Arktos.app',        dmg: 'Arktos-${VERSION}.dmg' }
          - { flavor: noservo, app: 'ArktosNoServo.app', dmg: 'Arktos-NoServo-${VERSION}.dmg' }
    # NOTE: do NOT set AWS_LC_SYS_NO_ASM here — aws-lc-sys panics on it
    # for release builds ("only allowed for debug builds"), and the
    # aarch64-apple-darwin target has pregenerated clang asm anyway.
    env:
      FLAVOR: ${{ matrix.flavor }}
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: 'clang_64'
          modules: 'qtwebengine qt5compat qtwebchannel qtpositioning qtserialport'
          cache: true

      - name: Derive QTDIR
        run: |
          QMAKE="$(command -v qmake || true)"
          [ -n "$QMAKE" ] || { echo "no qmake on PATH — install-qt did not expose bin" >&2; exit 1; }
          QTDIR="$(dirname "$(dirname "$(readlink -f "$QMAKE")")")"
          echo "QTDIR=$QTDIR" >> "$GITHUB_ENV"

      - name: Cache servo-embed cargo target
        if: matrix.flavor == 'servo'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/servo/servo-embed
          key: servo-macos

      - name: Build servo-embed cdylib
        if: matrix.flavor == 'servo'
        # The linux-only linker wrapper in .cargo/config.toml is a
        # target-triple match — aarch64-apple-darwin ignores it, no
        # override needed here.  Built BEFORE qmake so .qmake.conf
        # auto-enables CONFIG+=servo off the .dylib's existence.
        run: |
          cargo build --release --manifest-path spikes/servo/servo-embed/Cargo.toml
          test -f spikes/servo/servo-embed/target/release/libservo_embed.dylib

      - name: Build
        run: |
          "$QTDIR/bin/qmake" -o Makefile arktos.pro
          make -j"$(sysctl -n hw.ncpu)"
          [ "$FLAVOR" = servo ] || mv Arktos.app "$APP"

      - name: Stage payload + bundled tor into the .app
        run: |
          # The unix install block is !mac-gated, so stage the payload
          # (compiled translations, useragents.xml, bundled extensions)
          # straight from the source tree into the bundle-relative path
          # installedDataDirectory() resolves.
          mkdir -p "$APP/Contents/Resources/share/arktos"
          cp -a src/.qm/locale "$APP/Contents/Resources/share/arktos/"
          cp -a src/useragent/useragents.xml \
                "$APP/Contents/Resources/share/arktos/"
          cp -a src/data/extensions \
                "$APP/Contents/Resources/share/arktos/"
          # tor expert bundle where TorManager's bundled-layout
          # search (<bindir>/../lib/tor, binaryDir/../data) finds it.
          ARKTOS_TOR_PREFIX="$PWD/torpayload" sh BuildProcess/fetch-tor.sh
          mkdir -p "$APP"/Contents/lib
          cp -a torpayload/tor "$APP"/Contents/lib/tor
          cp -a torpayload/data "$APP"/Contents/lib/data
          # Adhoc-sign the tor helper + its bundled dylibs — an
          # unsigned Mach-O inside a quarantined app gets exec-killed
          # by Gatekeeper on modern macOS ("Failed to launch tor").
          codesign -s - --force "$APP"/Contents/lib/tor/tor
          find "$APP"/Contents/lib/tor -name '*.dylib' \
               -exec codesign -s - --force {} +
          # servo-embed dylib — ServoBackend::artifactPath() resolves
          # <bindir>/../lib/ (= Contents/lib, beside bundled tor).
          # dlopen'd, so macdeployqt never learns about it; adhoc-sign
          # it like the rest of the unsigned bundle.
          if [ -f spikes/servo/servo-embed/target/release/libservo_embed.dylib ]; then
            cp -a spikes/servo/servo-embed/target/release/libservo_embed.dylib \
                  "$APP"/Contents/lib/
            codesign -s - --force "$APP"/Contents/lib/libservo_embed.dylib
          fi

      - name: Package .dmg
        run: |
          "$QTDIR/bin/macdeployqt" "$APP" -verbose=1
          # Launch smoke on the DEPLOYED bundle: macdeployqt shipped a
          # dmg once with an unresolved @rpath/QtSerialPort inside
          # QtWebEngineProcess — silent quit on the user's Mac.
          # Missing frameworks must kill CI, not the dock icon.
          QT_QPA_PLATFORM=offscreen QTWEBENGINE_CHROMIUM_FLAGS=--disable-gpu \
            perl -e 'alarm 120; exec @ARGV' \
            "$APP"/Contents/MacOS/Arktos --quit-after-load
          # RC10 link-proof: macdeployqt never sees the statically
          # linked rustcore — prove the facade is inside the deployed
          # binary.  Cargo is guaranteed on this leg (the servo-embed
          # build hard-fails without it), so a missing ac_init means
          # qmake silently shipped the no-rust fallback.  Byte-grep, not
          # nm|grep -q: grep -q's early exit SIGPIPEs nm under pipefail.
          grep -q 'ac_init' "$APP"/Contents/MacOS/Arktos \
            || { echo "facade symbol ac_init missing — rustcore not linked" >&2; exit 1; }
          # libservo_embed.dylib is the one rust artifact shipped as a
          # file (dlopen'd) — the servo leg's build step guarantees it;
          # the noservo bundle must NOT carry it.
          if [ "$FLAVOR" = servo ]; then
            test -f "$APP"/Contents/lib/libservo_embed.dylib \
              || { echo "libservo_embed.dylib missing from bundle" >&2; exit 1; }
          else
            test ! -e "$APP"/Contents/lib/libservo_embed.dylib \
              || { echo "noservo bundle carries libservo_embed.dylib" >&2; exit 1; }
          fi
          # macdeployqt's own -dmg output is a bare volume — no
          # /Applications link, no install affordance. Build the
          # classic drag-to-Applications layout ourselves: a staging
          # dir holding the .app beside an Applications symlink, then
          # a compressed UDZO image of it.
          # Trim what we own: strip the app binary (Qt frameworks ship
          # pre-stripped) and drop .dSYM/debug droppings if any slipped in.
          strip -x "$APP"/Contents/MacOS/Arktos 2>/dev/null || true
          find "$APP" -name '*.dSYM' -exec rm -rf {} + 2>/dev/null || true
          mkdir dmg-root
          cp -R "$APP" dmg-root/
          ln -s /Applications dmg-root/Applications
          # ULFO = lzfse (macOS 10.11+): ~10-15% smaller than UDZO zlib
          # on binary payloads.  The floor is QtWebEngineCore (~300MB
          # of Chromium) — compression can't shrink the engine itself.
          VERSION=${GITHUB_REF_NAME#v}
          hdiutil create -volname "Arktos" -srcfolder dmg-root -ov -format ULFO "${{ matrix.dmg }}"

      - uses: actions/upload-artifact@v7
        with:
          name: arktos-macos-${{ matrix.flavor }}
          path: '*.dmg'

  release:
    needs: [deb, rpm, flatpak, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: arktos-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          shopt -s nullglob
          assets=(release-assets/*.deb release-assets/*.rpm \
                  release-assets/*.flatpak release-assets/*.dmg \
                  release-assets/*.zip \
                  release-assets/*Installer*.exe)
          # Belt for the spec fix: never ship -debuginfo/-debugsource rpms.
          filtered=()
          for a in "${assets[@]}"; do
            case "$a" in *debuginfo*|*debugsource*) ;; *) filtered+=("$a");; esac
          done
          assets=("${filtered[@]}")
          [ ${#assets[@]} -gt 0 ] || { echo "no release assets collected" >&2; exit 1; }
          ls -la release-assets/
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --title "Arktos ${GITHUB_REF_NAME#v}" \
            --notes-file BuildProcess/release-notes.md
