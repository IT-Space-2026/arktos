# RDEF01 — the Rust components are the DEFAULT build path (user
# directive: what we made in Rust is the default used code).  qmake
# loads this file while locating the project, BEFORE it applies
# command-line CONFIG assignments — so the opt-outs work naturally:
#
#   qmake CONFIG-=rustcore        # drop one crate
#   qmake CONFIG-=rustdl          #
#   qmake CONFIG-=adblock_rust    #
#   qmake CONFIG+=no-rust         # drop all three (the crate scopes
#                                 # in src/*.pri gate on !no-rust)
#
# When no cargo toolchain resolves — PATH first, then the user-local
# rustup home — the flags are simply never added and the tree builds
# the Qt fallback paths untouched, so a Rust-less host never breaks
# (arktos.pro warns loudly so the fallback is never silent).
# Toolchain is the user-local rustup; no sudo, no system packages.
ARKTOS_CARGO = $$system(command -v cargo 2>/dev/null)
isEmpty(ARKTOS_CARGO):unix:exists($$(HOME)/.cargo/bin/cargo): \
    ARKTOS_CARGO = $$(HOME)/.cargo/bin/cargo
isEmpty(ARKTOS_CARGO):win32:exists($$(USERPROFILE)/.cargo/bin/cargo.exe): \
    ARKTOS_CARGO = $$(USERPROFILE)\\.cargo\\bin\\cargo.exe

!isEmpty(ARKTOS_CARGO): CONFIG += rustcore rustdl adblock_rust

# ENG10 — the Servo backend opt-in is sticky.  A plain `qmake && make`
# once compiled ARKTOS_SERVO back out and silently dropped the engine
# selector on a servo-enabled dev build, so the flag is now auto-added
# whenever the servo-embed cdylib exists on disk (the artifact is the
# real signal — a servo build always has it, a servo-less tree never
# does).  This file loads before command-line CONFIG assignments, so
# every opt-out wins over the auto-enable:
#
#   qmake CONFIG-=servo   # strip the auto-added flag for this build
#   qmake noservo=1       # explicit off (var survives CONFIG churn)
#   qmake servo=0         # explicit off (servo=1 stays the artifact-
#                         # less opt-in — the backend compiles and the
#                         # cdylib is still only dlopen'd at runtime)
#
# ENG29 — the canonical artifact step is `cargo build --release` in
# spikes/servo/servo-embed/ (link via the crate's cc-lld.sh wrapper;
# ~20 min cold).  A target/debug cdylib still resolves — the runtime
# prefers release at every candidate depth and warns loudly + marks
# the engine name when only a debug build is found — but it is
# pathologically slow, so debug-only artifact sets are a configure-
# time warning in engine.pri, not a silent pick.
#
# ($$files() globbing does not run in .qmake.conf context — probe the
# cargo profile dirs directly.  The cdylib's name follows the host:
# libservo_embed.so on linux, .dylib on macOS, servo_embed.dll on
# windows — probe all three so a checkout built on any platform
# auto-enables the backend.)
# for() iterates a bare variable name only under qmake 6.12 — a literal
# list (`for(profile, debug release)`) loops over nothing, which is why
# the profile dirs ride through ARKTOS_SERVO_PROFILES.
ARKTOS_SERVO_LIBNAMES = libservo_embed.so libservo_embed.dylib servo_embed.dll
ARKTOS_SERVO_PROFILES = debug release
for(profile, ARKTOS_SERVO_PROFILES) {
    for(libname, ARKTOS_SERVO_LIBNAMES) {
        exists($$PWD/spikes/servo/servo-embed/target/$$profile/$$libname): \
            ARKTOS_SERVO_ARTIFACTS += \
                $$PWD/spikes/servo/servo-embed/target/$$profile/$$libname
    }
}
isEmpty(noservo):!equals(servo, 0):!isEmpty(ARKTOS_SERVO_ARTIFACTS): \
    CONFIG += servo
