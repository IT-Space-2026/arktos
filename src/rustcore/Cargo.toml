[package]
name = "arora-rustcore"
version = "0.1.0"
edition = "2021"
description = "Arora shared Rust core — engine-neutral app services behind a C FFI"
license = "GPL-2.0-or-later"
publish = false

# staticlib is what the qmake build links (same pattern as
# src/adblock/rust — single binary, no rpath/deployment concerns).
# cdylib is emitted too so out-of-tree consumers get the portable
# .so/.dylib/.dll artifact per the shared-core direction.
[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Crypto crates are exact-pinned (RCORE01/SEC21 policy): a dep bump is
# a deliberate, reviewed `cargo update` + audit, never a silent
# re-resolve.  Cargo.lock is committed for the transitive tree.
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
zeroize = "=1.8.1"
getrandom = "=0.2.15"
serde_json = "1.0.151"
# Parser crate is exact-pinned too (SEC19): untrusted remote XML goes
# through it, so a dep bump is a reviewed `cargo update`, never a
# silent re-resolve.  `encoding` keeps parity with QXmlStreamReader's
# BOM / `<?xml encoding=...?>` handling.
quick-xml = { version = "=0.42.0", features = ["encoding"] }
rusqlite = { version = "=0.35.0", features = ["bundled"] }
lopdf = "=0.45.0"
# libc::localtime_r for the frecency bucketing's local-calendar-day
# ages (Qt computes daysTo on the date parts, not elapsed time).
# Exact-pinned like the rest of the reviewed tree (SEC21).
libc = "=0.2.190"
# TLS probe (SEC22): a real client handshake + independent chain
# evaluation as a second opinion beside the engine's verifier.
# Exact-pinned like the rest of the reviewed tree.  `ring` is the
# crypto provider — it keeps the build C-compiler-only (aws-lc-rs
# would add a much heavier assembly/cmake build for no difference in
# what the probe verifies).
rustls = { version = "=0.23.46", default-features = false,
           features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
rustls-webpki = "=0.103.15"
x509-parser = "=0.18.1"
# Extension-package verification (EXT06): SHA-256 of downloaded
# packages vs the update-manifest hash, and pure-Rust inflate for
# reading manifest.json out of a deflated zip member.  Exact-pinned
# like the rest of the reviewed tree.
# sha2 rides the digest-0.11 line so the PVAULT01 HMAC-SHA-512 /
# HMAC-Skein-512 MACs share one hmac/digest trait universe with the
# skein crate (digest 0.11 only); extverify's Sha256::digest use is
# API-identical across the bump.
sha2 = "=0.11.0"
miniz_oxide = "=0.8.9"
# Profile vault (PVAULT01): chunked, password-sealed profile archives.
# hmac supplies HMAC-SHA-512 (header + whole-payload MACs) and the
# Skein-MAC construction for the optional Threefish lane; threefish
# is used at the hazmat block-cipher level (new_with_tweak +
# encrypt_block_u64 — the cipher-feature trait plumbing is unused);
# tar is the "tar-style pack" the chunks encrypt.  Exact-pinned like
# the rest of the reviewed tree.
hmac = "=0.13.0"
threefish = { version = "=0.6.0", default-features = false }
skein = { version = "=0.2.0", default-features = false }
tar = "=0.4.46"
dom_smoothie = "=0.18.2"
dom_query = "=0.28.0"
# QR encoding (QRC01): Nayuki's qrcodegen-rs — the same code lineage
# (and MIT license) as the vendored C++ qrcodegen.cpp it replaces, so
# the module matrix is bit-identical.  Exact-pinned like the rest of
# the reviewed tree.
qrcodegen = "=1.8.0"
# PDF page rasterization (PDF02): hayro is a pure-Rust PDF renderer —
# `#![forbid(unsafe_code)]` end to end, Apache-2.0/MIT, no C++ blob to
# audit (pdfium-render would drag a downloaded libpdfium.so into the
# confined worker instead).  `embed-fonts` bundles the 14 base-font
# substitutes so the renderer needs no font filesystem inside the
# sandbox.  Exact-pinned like the rest of the reviewed tree.
hayro = { version = "=0.8.0", features = ["embed-fonts"] }
