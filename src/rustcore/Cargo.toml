[package]
name = "arktos-rustcore"
version = "0.1.0"
edition = "2021"
description = "Arktos shared Rust core — engine-neutral app services behind a C FFI"
license = "GPL-2.0-or-later"
publish = false

# staticlib is what the qmake build links (same pattern as
# src/adblock/rust — single binary, no rpath/deployment concerns).
# cdylib is emitted too so out-of-tree consumers get the portable
# .so/.dylib/.dll artifact per the shared-core direction.
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "synctorping"
path = "src/bin/synctorping.rs"
required-features = ["synctor"]

# SYNC02: `--no-default-features` builds a lean rustcore without the
# embedded Arti tree (the "tor" transport backend then answers a typed
# unavailable; the hermetic "mem" backend stays for tests).
[features]
default = ["synctor"]
synctor = ["dep:arti-client", "dep:tor-hsservice",
           "dep:tor-hscrypto", "dep:tor-keymgr", "dep:tor-cell",
           "dep:tor-proto", "dep:tor-config", "dep:tor-config-path",
           "dep:tor-rtcompat",
           "dep:tokio",
           "dep:futures", "dep:safelog"]

[dependencies]
# Crypto crates are exact-pinned (RCORE01/SEC21 policy): a dep bump is
# a deliberate, reviewed `cargo update` + audit, never a silent
# re-resolve.  Cargo.lock is committed for the transitive tree.
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
zeroize = "=1.8.1"
getrandom = "=0.2.15"
serde_json = "1.0.151"
# Parser crate is exact-pinned too (SEC19): untrusted remote XML goes
# through it, so a dep bump is a reviewed `cargo update`, never a
# silent re-resolve.  `encoding` keeps parity with QXmlStreamReader's
# BOM / `<?xml encoding=...?>` handling.
quick-xml = { version = "=0.42.0", features = ["encoding"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
lopdf = "=0.45.0"
# libc::localtime_r for the frecency bucketing's local-calendar-day
# ages (Qt computes daysTo on the date parts, not elapsed time).
# Exact-pinned like the rest of the reviewed tree (SEC21).
libc = "=0.2.190"
# TLS probe (SEC22): a real client handshake + independent chain
# evaluation as a second opinion beside the engine's verifier.
# Exact-pinned like the rest of the reviewed tree.  `ring` is the
# crypto provider — it keeps the build C-compiler-only (aws-lc-rs
# would add a much heavier assembly/cmake build for no difference in
# what the probe verifies).
rustls = { version = "=0.23.46", default-features = false,
           features = ["ring", "logging", "std", "tls12"] }
# Sync identity (SYNC01): Ed25519 device keypairs sign every op in
# the sync log.  `ring` is already the tree's reviewed crypto
# provider (rustls) — exact-pinned to the locked version, same
# policy as the rest of the crypto deps.
ring = "=0.17.14"
rustls-native-certs = "=0.8.4"
rustls-webpki = "=0.103.16"
x509-parser = "=0.18.1"
# Extension-package verification (EXT06): SHA-256 of downloaded
# packages vs the update-manifest hash, and pure-Rust inflate for
# reading manifest.json out of a deflated zip member.  Exact-pinned
# like the rest of the reviewed tree.
# sha2 rides the digest-0.11 line so the PVAULT01 HMAC-SHA-512 /
# HMAC-Skein-512 MACs share one hmac/digest trait universe with the
# skein crate (digest 0.11 only); extverify's Sha256::digest use is
# API-identical across the bump.
sha2 = "=0.11.0"
miniz_oxide = "=0.8.9"
# Profile vault (PVAULT01): chunked, password-sealed profile archives.
# hmac supplies HMAC-SHA-512 (header + whole-payload MACs) and the
# Skein-MAC construction for the optional Threefish lane; threefish
# is used at the hazmat block-cipher level (new_with_tweak +
# encrypt_block_u64 — the cipher-feature trait plumbing is unused);
# tar is the "tar-style pack" the chunks encrypt.  Exact-pinned like
# the rest of the reviewed tree.
hmac = "=0.13.0"
threefish = { version = "=0.6.0", default-features = false }
skein = { version = "=0.2.0", default-features = false }
tar = "=0.4.46"
dom_smoothie = "=0.18.2"
dom_query = "=0.28.0"
# QR encoding (QRC01): Nayuki's qrcodegen-rs — the same code lineage
# (and MIT license) as the vendored C++ qrcodegen.cpp it replaces, so
# the module matrix is bit-identical.  Exact-pinned like the rest of
# the reviewed tree.
qrcodegen = "=1.8.0"
# Sync transport (SYNC02): embedded Arti carries the sync wire ops —
# a per-device v3 onion service (hsid persisted in the Arti keystore,
# so the address is stable across restarts) gated by restricted
# discovery (x25519 authorized-client descriptor encryption — unpaired
# peers are refused at the Tor layer, before any app bytes), plus the
# client side for outbound circuits to peers' onions.  `static-sqlite`
# keeps the dir-cache sqlite bundled (no system -lsqlite3).  Exact-
# pinned like the rest of the reviewed tree (SEC21); `experimental-api`
# is required for the discovery-key and restricted-discovery surface.
arti-client = { version = "=0.47.0", default-features = false,
    optional = true,
    features = ["tokio", "rustls", "static-sqlite", "keymgr",
                "onion-service-client", "onion-service-service",
                "restricted-discovery", "experimental-api"] }
tor-hsservice = { version = "=0.47.0", optional = true,
    features = ["restricted-discovery", "experimental-api"] }
tor-hscrypto = { version = "=0.47.0", optional = true }
tor-keymgr = { version = "=0.47.0", optional = true, features = ["keymgr"] }
tor-cell = { version = "=0.47.0", optional = true }
tor-config = { version = "=0.47.0", optional = true }
tor-config-path = { version = "=0.47.0", optional = true }
tor-proto = { version = "=0.47.0", optional = true }
tor-rtcompat = { version = "=0.47.0", optional = true,
    features = ["tokio", "rustls"] }
tokio = { version = "=1.54.1", optional = true,
    features = ["rt-multi-thread", "sync", "time", "macros"] }
futures = { version = "=0.3.34", optional = true }
safelog = { version = "=0.10.0", optional = true }
# PDF page rasterization (PDF02): hayro is a pure-Rust PDF renderer —
# `#![forbid(unsafe_code)]` end to end, Apache-2.0/MIT, no C++ blob to
# audit (pdfium-render would drag a downloaded libpdfium.so into the
# confined worker instead).  `embed-fonts` bundles the 14 base-font
# substitutes so the renderer needs no font filesystem inside the
# sandbox.  Exact-pinned like the rest of the reviewed tree.
hayro = { version = "=0.8.0", features = ["embed-fonts"] }
tor-llcrypto = "=0.47.0"
# Sync key rotation (SYNC09): the rekey wrap converts a member's
# Ed25519 device pubkey to its Montgomery image — already pinned in
# the committed lock via the Arti tree, so the dep adds no new
# transitive surface.  Exact-pinned like the rest of the crypto deps.
curve25519-dalek = "=4.1.3"
