[package]
name = "arora-rustcore"
version = "0.1.0"
edition = "2021"
description = "Arora shared Rust core — engine-neutral app services behind a C FFI"

# staticlib is what the qmake build links (same pattern as
# src/adblock/rust — single binary, no rpath/deployment concerns).
# cdylib is emitted too so out-of-tree consumers get the portable
# .so/.dylib/.dll artifact per the shared-core direction.
[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Crypto crates are exact-pinned (RCORE01/SEC21 policy): a dep bump is
# a deliberate, reviewed `cargo update` + audit, never a silent
# re-resolve.  Cargo.lock is committed for the transitive tree.
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
zeroize = "=1.8.1"
getrandom = "=0.2.15"
serde_json = "1.0.151"
# Parser crate is exact-pinned too (SEC19): untrusted remote XML goes
# through it, so a dep bump is a reviewed `cargo update`, never a
# silent re-resolve.  `encoding` keeps parity with QXmlStreamReader's
# BOM / `<?xml encoding=...?>` handling.
quick-xml = { version = "=0.42.0", features = ["encoding"] }
