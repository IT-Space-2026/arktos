# cargo-deny policy for the Rust surface (SEC21).  Applies to every
# crate in the tree; run with `cargo deny check` from a crate dir or a
# workspace root once the SEC21 gate wires it into `make check`.

[advisories]
# Fail on any unpatched advisory in a dependency we ship.
db-url = "https://github.com/rustsec/advisory-db"
yanked = "deny"

[licenses]
# GPL-incompatible only in the copyleft direction matters here (the
# browser is GPLv2+): permissive licenses are all fine.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
# One version per crate — surprises in the transitive tree get
# reviewed, not silently duplicated.
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
# crates.io only — no git deps or unknown registries in the core.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
