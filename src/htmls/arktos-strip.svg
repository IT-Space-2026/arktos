<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="40" viewBox="0 0 3000 40">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#22f59a" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#3fd2f0" stop-opacity="1"/>
      <stop offset="1"    stop-color="#a24ef5" stop-opacity="1"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="ribbon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <!-- Compressed version of the start-page aurora dome: ribbons dip
       low at the edges and crest over the bar's center so the wave
       is readable at 30px bar height, not just a tint. -->
  <path d="M -60 52 C 700 46 1150 18 1500 12 C 1850 18 2300 46 3060 52"
        fill="none" stroke="url(#g)" stroke-width="52" opacity="0.45" filter="url(#soft)"/>
  <path d="M -60 40 C 750 32 1180 8 1500 3 C 1820 8 2250 32 3060 40"
        fill="none" stroke="url(#g)" stroke-width="9" opacity="0.95" filter="url(#ribbon)"/>
  <path d="M -60 48 C 750 42 1180 18 1500 13 C 1820 18 2250 42 3060 48"
        fill="none" stroke="url(#g)" stroke-width="6" opacity="0.85" filter="url(#ribbon)"/>
  <path d="M -60 30 C 800 24 1200 -1 1500 -4 C 1800 -1 2200 24 3060 30"
        fill="none" stroke="url(#g)" stroke-width="4" opacity="0.7" filter="url(#ribbon)"/>
</svg>
