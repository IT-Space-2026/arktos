<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="40" viewBox="0 0 3000 40">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#22f59a" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#3fd2f0" stop-opacity="0.5"/>
      <stop offset="1"    stop-color="#a24ef5" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ribbon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <!-- Shallow aurora dome compressed to a 40px strip: the same
       crest shape as aurora-wave.svg, cresting at x1500 (bar
       center) so the wave reads as continuing the start-page arc
       into the header chrome. -->
  <path d="M -60 42 C 700 36 1150 16 1500 14 C 1850 16 2300 36 3060 42"
        fill="none" stroke="url(#g)" stroke-width="46" opacity="0.35" filter="url(#soft)"/>
  <path d="M -60 30 C 750 24 1180 8 1500 6 C 1820 8 2250 24 3060 30"
        fill="none" stroke="url(#g)" stroke-width="7" opacity="0.85" filter="url(#ribbon)"/>
  <path d="M -60 37 C 750 32 1180 17 1500 15 C 1820 17 2250 32 3060 37"
        fill="none" stroke="url(#g)" stroke-width="4.5" opacity="0.7" filter="url(#ribbon)"/>
  <path d="M -60 23 C 800 17 1200 3 1500 1 C 1800 3 2200 17 3060 23"
        fill="none" stroke="url(#g)" stroke-width="3" opacity="0.5" filter="url(#ribbon)"/>
</svg>
