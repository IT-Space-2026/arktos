    <rect x="3" y="3" width="4.2" height="4.2" rx="0.8" fill="#7a7a7a"/>
    <rect x="8.8" y="3" width="4.2" height="4.2" rx="0.8" fill="#7a7a7a"/>
    <rect x="3" y="8.8" width="4.2" height="4.2" rx="0.8" fill="#7a7a7a"/>
    <rect x="8.8" y="8.8" width="4.2" height="4.2" rx="0.8" fill="#7a7a7a"/>
</svg>
