<?xml version="1.0" encoding="UTF-8"?>
<!-- SHLD01: shield glyph for the location-bar site panel button.
     Lives in the legacy theme so every bundled set resolves it through
     Inherits=, and native/icon-theme mode can substitute the desktop's
     own security-high artwork.  The mid-grey fill stays readable on
     both light and dark palettes (QtSvg does not recolor). -->
<svg xmlns="http://www.w3.org/2000/svg" height="16" width="16" viewBox="0 0 16 16">
    <path d="M8 1.2 2.2 3.3v4.3c0 3.6 2.6 6.1 5.8 7.2 3.2-1.1 5.8-3.6 5.8-7.2V3.3Z" fill="#7a7a7a"/>
</svg>
