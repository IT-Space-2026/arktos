<?xml version="1.0" encoding="UTF-8"?>
<!-- ICONS07: small frame nested in a big one — View >
     Picture-in-Picture.  Mid-grey stays readable on light and dark
     palettes. -->
<svg xmlns="http://www.w3.org/2000/svg" height="16" width="16" viewBox="0 0 16 16">
    <rect x="1.8" y="3" width="12.4" height="9.8" rx="1" fill="none" stroke="#7a7a7a" stroke-width="1.3"/>
    <rect x="8.2" y="8.4" width="4.4" height="3.2" rx="0.7" fill="#7a7a7a"/>
</svg>
