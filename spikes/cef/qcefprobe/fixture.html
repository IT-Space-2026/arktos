<!DOCTYPE html>
<!-- CEF01 probe fixture — same witness map as
     spikes/webkit/fixtures/paint-proof.html so all engine probes share
     one pixel contract:

       point      expected   element
       (5,5)      #404040    page background
       (60,60)    #ff0000    #block-red
       (180,60)   #00ff00    #block-green
       (290,60)   #0000ff    #block-blue
       (60,150)   #ffffff    #text-band
-->
<html>
<head>
<meta charset="utf-8"/>
<title>cef-paint-proof</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #404040;
    overflow: hidden;
}
.block {
    position: absolute;
    top: 10px;
    width: 100px;
    height: 100px;
}
#block-red   { left: 10px;  background: #ff0000; }
#block-green { left: 120px; background: #00ff00; }
#block-blue  { left: 230px; background: #0000ff; }
#text-band {
    position: absolute;
    left: 10px;
    top: 120px;
    width: 320px;
    height: 70px;
    background: #ffffff;
    color: #000000;
    font: bold 28px sans-serif;
    line-height: 70px;
    text-align: center;
}
</style>
</head>
<body>
<div id="block-red" class="block"></div>
<div id="block-green" class="block"></div>
<div id="block-blue" class="block"></div>
<div id="text-band">CEF PAINT PROOF</div>
<script>
// Codec verdict probe — reports to CefDisplayHandler::OnConsoleMessage.
// canPlayType returns "" when the codec is absent from the build.
(function () {
    var v = document.createElement('video');
    var a = document.createElement('audio');
    function vt(mime, codecs) {
        return v.canPlayType('video/' + mime + '; codecs="' + codecs + '"') || 'no';
    }
    var r = {
        'h264':  vt('mp4', 'avc1.42E01E'),
        'hevc':  vt('mp4', 'hev1.1.6.L93.B0'),
        'vp9':   vt('webm', 'vp9'),
        'av1':   vt('mp4', 'av01.0.04M.08'),
        'aac':   a.canPlayType('audio/mp4; codecs="mp4a.40.2"') || 'no',
        'mp3':   a.canPlayType('audio/mpeg') || 'no',
        'opus':  a.canPlayType('audio/webm; codecs="opus"') || 'no',
        'vorbis':a.canPlayType('audio/ogg; codecs="vorbis"') || 'no'
    };
    var s = [];
    for (var k in r) s.push(k + '=' + r[k]);
    console.log('CODEC ' + s.join(' '));
}());
</script>
</body>
</html>
