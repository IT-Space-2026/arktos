<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WK03 render fixture</title>
<style>
  /* Witness colors the shot analyzer looks for:
       page bg #eef4ff, header band #123a6f, box #22aa77. */
  body  { margin: 0; background: #eef4ff; color: #123;
          font: 20px/1.4 sans-serif; }
  #top  { height: 120px; background: #123a6f; color: #fff;
          display: flex; align-items: center; padding-left: 24px;
          font-size: 28px; }
  #box  { width: 320px; height: 160px; margin: 40px;
          background: #22aa77; color: #fff;
          display: flex; align-items: center; justify-content: center;
          border-radius: 10px; }
  #grad { height: 60px; margin: 40px;
          background: linear-gradient(90deg, #e33, #3e7); }
</style>
</head>
<body>
<div id="top">WK03 render path — header band</div>
<div id="box">imported buffer paint</div>
<div id="grad"></div>
</body>
</html>
