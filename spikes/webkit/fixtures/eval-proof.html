<!DOCTYPE html>
<!-- WKB06 spike fixture — consumed by WK04 leg (b) (eval smoke:
     webkit_web_view_evaluate_javascript returns a typed JSCValue).

     The globals below are installed synchronously at parse time, so
     they are readable as soon as the load finishes — no async wait
     needed:

       window.EVAL_NUMBER  = 42                    (number)
       window.EVAL_STRING  = "arora-eval-proof"    (string)
       window.EVAL_BOOL    = true                  (boolean)
       window.EVAL_OBJECT  = {"answer":42,"label":"arora"}
       window.evalSum(a,b) = a + b                 (function)

     Suggested asserts (expression -> expected typed result):
       "EVAL_NUMBER"                  -> number 42
       "EVAL_STRING"                  -> string "arora-eval-proof"
       "EVAL_BOOL"                    -> boolean true
       "typeof EVAL_NUMBER"           -> string "number"
       "evalSum(20, 22)"              -> number 42
       "JSON.stringify(EVAL_OBJECT)"  -> string {"answer":42,"label":"arora"}

     DOM cross-checks: document.title == "arora-eval-proof" and
     #eval-marker carries the literal marker text. -->
<html>
<head>
<meta charset="utf-8"/>
<title>arora-eval-proof</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
}
#eval-marker {
    position: absolute;
    left: 20px;
    top: 20px;
    font: 18px monospace;
    color: #000000;
}
</style>
</head>
<body>
<div id="eval-marker">EVAL PROOF 42 arora-eval-proof</div>
<script>
window.EVAL_NUMBER = 42;
window.EVAL_STRING = "arora-eval-proof";
window.EVAL_BOOL = true;
window.EVAL_OBJECT = { answer: 42, label: "arora" };
window.evalSum = function (a, b) { return a + b; };
</script>
</body>
</html>
